[phases.setup]
nixPkgs = ["nodejs_18", "npm-9_x"]

# NÃO definir NODE_ENV=production aqui.
# Se estiver em production no install, o npm omite devDependencies
# (vite, svelte, plugin) e o build quebra.

[variables]
# Frontend NÃO usa Playwright — evita provedor Nixpacks do backend
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
NIXPACKS_NO_CACHE = "0"

[phases.install]
cmds = [
  "npm config set fetch-retries 5",
  "npm config set fetch-retry-mintimeout 20000",
  "npm config set fetch-retry-maxtimeout 120000",
  "npm config set progress false",
  "npm config set loglevel warn",
  # Força instalação das devDependencies mesmo se a plataforma definir production
  "NPM_CONFIG_PRODUCTION=false npm ci --no-audit --legacy-peer-deps --include=dev || NPM_CONFIG_PRODUCTION=false npm install --no-audit --legacy-peer-deps --include=dev"
]

[phases.build]
cmds = [
  "ls -la index.html embed.html vite.config.js package.json",
  "rm -rf .vite dist 2>/dev/null || true",
  "NODE_ENV=production NODE_OPTIONS='--max-old-space-size=4096' npm run build"
]

[start]
cmd = "npm start"
